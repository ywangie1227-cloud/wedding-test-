<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yen & Angie's Wedding Invitation</title>
  
  <!-- 字體載入：Cormorant Garamond 與 Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* 全局變數與 Morandi 暖陽色系 */
    :root {
      --primary-warm: #d4a373;
      --secondary-sage: #8da399;
      --bg-cream: #faf8f5;
      --text-dark: #33302e;
      --text-muted: #7c7772;
      --white-card: rgba(255, 255, 255, 0.92);
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
      --font-en: 'Cormorant Garamond', serif;
      --font-zh: 'Noto Serif TC', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: var(--font-zh);
      line-height: 1.8;
    }

    /* 防止手機端關鍵地點文字斷行 */
    .no-wrap {
      white-space: nowrap;
      display: inline-block;
    }

    /* 頂端固定毛玻璃導航列 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(250, 248, 245, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 163, 115, 0.2);
    }

    nav {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
    }

    .nav-logo {
      font-family: var(--font-en);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary-warm);
      text-decoration: none;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.95rem;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--primary-warm);
    }

    /* 首頁全螢幕封面背景 */
    .hero {
      position: relative;
      height: 100vh;
      background: url('https://i.postimg.cc/k4s9DxpX/JUN00195-Korean-Edited.jpg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 0 1rem;
    }

    .hero-title {
      font-family: var(--font-en);
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
    }

    .hero-slogan {
      font-family: var(--font-en);
      font-style: italic;
      font-size: 1.4rem;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    .hero-date {
      font-family: var(--font-en);
      letter-spacing: 2px;
      font-size: 1.1rem;
    }

    /* 通用容器 */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-title h2 {
      font-family: var(--font-en);
      font-size: 2.5rem;
      color: var(--primary-warm);
      font-weight: 400;
      letter-spacing: 2px;
    }

    .section-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* 藝術感倒數計時器 (獨立白色微光卡片) */
    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .time-card {
      background: var(--white-card);
      border-radius: 12px;
      padding: 1.2rem 1rem;
      min-width: 80px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .time-num {
      font-family: var(--font-en);
      font-size: 2.2rem;
      color: var(--primary-warm);
      font-weight: 600;
      line-height: 1;
    }

    .time-unit {
      font-family: var(--font-en);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      text-transform: uppercase;
    }

    .timer-divider {
      width: 1px;
      height: 40px;
      background-color: rgba(212, 163, 115, 0.3);
    }

    /* V-Card 垂直資訊卡片 */
    .v-card {
      background: var(--white-card);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: var(--shadow-soft);
      margin-bottom: 2rem;
      text-align: center;
    }

    .v-card-item {
      margin-bottom: 1.5rem;
    }

    .v-card-item:last-child {
      margin-bottom: 0;
    }

    .v-card-label {
      font-family: var(--font-en);
      color: var(--secondary-sage);
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .v-card-val {
      font-size: 1.15rem;
      margin-top: 0.3rem;
    }

    /* 摺疊式面板 (Accordion) */
    .accordion {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      background: var(--white-card);
    }

    .accordion-btn {
      width: 100%;
      background: transparent;
      border: none;
      padding: 1.2rem 1.5rem;
      text-align: left;
      font-size: 1rem;
      font-family: var(--font-zh);
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s;
    }

    .accordion-btn:hover {
      background: rgba(212, 163, 115, 0.08);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease;
      background: rgba(255, 255, 255, 0.5);
      padding: 0 1.5rem;
    }

    .accordion-content.active {
      padding: 1.2rem 1.5rem;
    }

    /* 表單區塊與雙語標籤 */
    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
    }

    .form-label span {
      font-family: var(--font-en);
      font-size: 0.8rem;
      color: var(--secondary-sage);
      margin-left: 0.3rem;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid rgba(141, 163, 153, 0.4);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      font-family: var(--font-zh);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      border-color: var(--primary-warm);
    }

    .hidden-field {
      display: none;
    }

    .sub-section-title {
      color: var(--primary-warm);
      font-size: 1.1rem;
      margin: 1.8rem 0 1rem 0;
      padding-bottom: 0.3rem;
      border-bottom: 1px dashed rgba(212, 163, 115, 0.4);
      text-align: left;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-warm);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-family: var(--font-zh);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3);
      transition: background 0.3s;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      background: #c39263;
    }

    /* RWD 手機版優化 */
    @media (max-width: 600px) {
      .hero-title { font-size: 2.8rem; }
      .timer-container { gap: 0.4rem; }
      .time-card { min-width: 65px; padding: 0.8rem 0.5rem; }
      .time-num { font-size: 1.6rem; }
      .v-card { padding: 1.5rem; }
    }
  </style>
</head>
